name: Auto Update Islamic Wallpapers

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      max_images:
        description: 'Maximum new wallpapers to fetch'
        required: false
        default: '50'
        type: string
      source:
        description: 'Specific source ID to run (leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update-wallpapers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Run Wallpaper Scraper and Processor
        run: |
          MAX_IMG="${{ github.event.inputs.max_images }}"
          [ -z "$MAX_IMG" ] && MAX_IMG="50"
          
          SRC_ARG=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            SRC_ARG="--source ${{ github.event.inputs.source }}"
          fi

          python scripts/scraper.py --max-images "$MAX_IMG" $SRC_ARG --repo-owner "${{ github.repository_owner }}" --repo-name "${{ github.event.repository.name }}"

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/ images/ thumbnails/ logs/ sources/
          
          if git diff --staged --quiet; then
            echo "No changes or new wallpapers to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Automated update: new wallpapers added [$TIMESTAMP] [skip ci]"
            git push
          fi
